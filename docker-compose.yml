version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: speedwalking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: speedwalking_db
      POSTGRES_USER: speedwalking_user
      POSTGRES_PASSWORD: speedwalking_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedwalking_user -d speedwalking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Backend (Java 21 + Maven)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedwalking-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: speedwalking_db
      DB_USERNAME: speedwalking_user
      DB_PASSWORD: speedwalking_pass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # 3. Vue.js Frontend (Vue 3 + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: speedwalking-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
