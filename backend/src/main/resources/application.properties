spring.application.name=speedwalking-backend
server.port=8080

# Default Database: H2 In-Memory (Zero setup needed for immediate local running)
spring.datasource.url=jdbc:h2:mem:speedwalking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT configuration
jwt.secret=${JWT_SECRET:speedWalkingSecretKey2026SuperSecureKeyForJwtTokens987654321}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS settings
app.cors.allowed-origins=*

logging.level.org.springframework.security=WARN
logging.level.com.speedwalking=INFO
