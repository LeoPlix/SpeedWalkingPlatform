spring.application.name=speedwalking-backend
server.port=8080

# PostgreSQL Container Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:speedwalking_db}
spring.datasource.username=${DB_USERNAME:speedwalking_user}
spring.datasource.password=${DB_PASSWORD:speedwalking_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security / JWT configuration
jwt.secret=speedWalkingSecretKey2026SuperSecureKeyForJwtTokens987654321
jwt.expiration=86400000

# CORS settings
app.cors.allowed-origins=*

logging.level.org.springframework.security=WARN
logging.level.com.speedwalking=INFO
